# ═══════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline - Flutter Build & Test
# ═══════════════════════════════════════════════════════════════════════════
# Triggers on push to main and pull requests.
# Runs flutter analyze, flutter test, and builds APK/IPA artifacts.
# ═══════════════════════════════════════════════════════════════════════════

name: Flutter CI/CD

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.5"
  JAVA_VERSION: "17"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # ANALYZE & TEST
  # ═══════════════════════════════════════════════════════════════════════════
  analyze:
    name: 🔍 Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔧 Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔬 Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
        # Note: Info-level and deprecated API warnings are acceptable

      - name: 🧪 Run tests
        run: flutter test --coverage
        continue-on-error: true

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD ANDROID APK
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: 🤖 Build Android
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: 📦 Get dependencies
        run: flutter pub get

      # === FIREBASE CONFIG FROM SECRETS ===
      - name: 🔥 Create google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: 🔥 Create firebase_options.dart from secret
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > lib/firebase_options.dart

      - name: 🔨 Build APK (Release)
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: 📤 Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols-${{ github.sha }}
          path: build/debug-info/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD IOS IPA (macOS runner required)
  # ═══════════════════════════════════════════════════════════════════════════
  build-ios:
    name: 🍎 Build iOS
    needs: analyze
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: 📦 Get dependencies
        run: flutter pub get

      # === FIREBASE CONFIG FROM SECRETS ===
      - name: 🔥 Create GoogleService-Info.plist from secret
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: 🔥 Create firebase_options.dart from secret
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > lib/firebase_options.dart

      - name: 🍫 Setup CocoaPods cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 📦 Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: 🔨 Build iOS (No codesign for CI)
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/debug-info-ios

      - name: 📤 Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: warn

      - name: 📤 Upload iOS debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols-${{ github.sha }}
          path: build/debug-info-ios/
          retention-days: 30
