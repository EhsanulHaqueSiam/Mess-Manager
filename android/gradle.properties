org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
android.useAndroidX=true

# Performance: reuse daemon, parallel builds, caching
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Limit parallel workers to avoid CPU saturation
org.gradle.workers.max=2

# Kotlin daemon memory (separate from Gradle)
kotlin.daemon.jvmargs=-Xmx384m
